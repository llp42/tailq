name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A new push supersedes the runs of the one before.
concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Reads .markdownlint-cli2.jsonc: 120 columns at most, tables aligned.
      - run: npx --yes markdownlint-cli2@0.24.2

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The toolchain CI pins, in .github/actions/setup-rust.
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      # The lint levels, pedantic and nursery included, are in Cargo.toml, for every crate of the workspace.
      - run: cargo clippy --workspace --all-targets --locked
      # Release builds compile the debug checks out, which some lints see.
      - run: cargo clippy --workspace --all-targets --locked --release

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      # A broken intra-doc link or a missing doc fails the build.
      - run: cargo doc --no-deps --locked

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Every job time-limited, every test run built first and then run under limit.sh, clippy on release builds,
      # and coverage.py's filter and merge: what d7aa842 and f9f1d04 put in.
      - run: python3 -I .github/check_workflows.py
      # Every test command on its own under limit.sh, and limit.sh still limiting memory and time: what
      # check_workflows.py, reading whole lines, and nothing else checked.
      - run: python3 -I .github/check_limits.py
      # check_limits.py fed each case review 5 found, which it would pass on unflagged workflows whatever it read.
      - run: python3 -I .github/check_limits_test.py
      # check_workflows.py fed what review 7's mutants found it passed, and test.yml's flip, doctest and package steps.
      - run: python3 -I .github/check_workflows_test.py
      # What the jobs run, which nothing above reads: every Miri configuration, the nightly doctests, each job's
      # commands, no step or job that may fail softly, and the triggers; and every checker's main() running each rule.
      - run: python3 -I .github/check_runs.py
