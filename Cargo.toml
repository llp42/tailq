[package]
name = "tailq"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Leonardo Lopes Pereira <leonardolopespereira@outlook.com>"]
license = "MIT"
description = "no_std intrusive doubly-linked tail queue, after BSD's sys/queue.h TAILQ"
repository = "https://github.com/llp42/tailq"
readme = "README.md"
keywords = ["intrusive", "linked-list", "queue", "no-std", "tailq"]
categories = ["data-structures", "no-std", "no-std::no-alloc", "embedded"]
include = ["/src", "/tests", "/benches", "/README.md", "/LICENSE"]

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "tailq"
harness = false

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "deny"
elided_lifetimes_in_paths = "deny"
unused_qualifications = "deny"
trivial_numeric_casts = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
single_use_lifetimes = "deny"
unused_lifetimes = "deny"
trivial_casts = "deny"
unused_results = "deny"
unused_import_braces = "deny"
explicit_outlives_requirements = "deny"
redundant_lifetimes = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
variant_size_differences = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"  # the restriction group is denied on purpose; conflicting lints are allowed one by one
implicit_return = "allow"  # conflicts with needless_return
semicolon_inside_block = "allow"  # conflicts with semicolon_outside_block
missing_trait_methods = "allow"  # traits provide default methods so implementations can omit them
arbitrary_source_item_ordering = "allow"  # items follow their API relationships, not the alphabet
question_mark_used = "allow"  # ? is the idiomatic early return
pub_use = "allow"  # the crate root re-exports its public API
single_call_fn = "allow"
undocumented_unsafe_blocks = "allow"  # an unsafe fn's contract covers its blocks
multiple_unsafe_ops_per_block = "allow"  # operations sharing one precondition share one block
missing_docs_in_private_items = "allow"  # private items are documented only for what the code cannot say
redundant_pub_crate = "allow"  # conflicts with rustc's unreachable_pub
pub_with_shorthand = "allow"  # conflicts with pub_without_shorthand; use pub(crate)
